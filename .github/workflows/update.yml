name: Update market data

on:
  schedule:
    - cron: "45 13 * * 1-5"   # ~9:45am ET, after the open
    - cron: "15 20 * * 1-5"   # ~4:15pm ET, after the close
  workflow_dispatch:           # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scraper/fetch.py
      - name: Commit data
        run: |
          git config user.name "market-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet || git commit -m "Update market data $(date -u +'%Y-%m-%d %H:%M')"
          git push
